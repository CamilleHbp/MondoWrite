name: Subscription desktop builds
on:
  push:
    branches: [codex/chatgpt-subscription]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            asset: nsis/*.exe
          - os: ubuntu-22.04
            bundle: deb
            asset: deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*.exe
          7z t $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - if: runner.os == 'Linux'
        run: |
          dpkg-deb -I src-tauri/target/release/bundle/deb/*.deb
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/package"
          ldd "$RUNNER_TEMP/package/usr/bin/"* | tee "$RUNNER_TEMP/dependencies"
          ! grep -q 'not found' "$RUNNER_TEMP/dependencies"
      - uses: actions/upload-artifact@v4
        with:
          name: mondowrite-${{ runner.os }}
          path: src-tauri/target/release/bundle/${{ matrix.asset }}
          if-no-files-found: error
